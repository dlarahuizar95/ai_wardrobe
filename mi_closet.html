<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mi closet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --gris:#e5e5e5; --texto:#111; --sec:#666; --ok:#1f7a3a; --no:#b3261e; --warn:#8a6d00; }
  * { box-sizing:border-box }
  body { margin:0; background:#fff; color:var(--texto); font:15px/1.45 -apple-system, "Helvetica Neue", Inter, Arial, sans-serif }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--gris); padding:12px 28px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; z-index:2 }
  header h1 { font-size:18px; font-weight:600; margin:0 }
  .conteo { display:flex; gap:16px; color:var(--sec); font-size:14px }
  .conteo b { color:var(--texto) }
  .filtros { display:flex; gap:8px; margin-left:auto }
  select, button, textarea { font:inherit; font-size:14px; border:1px solid var(--gris); background:#fff; border-radius:6px; padding:7px 10px; color:#222 }
  button { cursor:pointer } button:hover { border-color:#999 } button:disabled { opacity:.5; cursor:default }
  #aviso { display:none; background:#fff6d6; color:var(--warn); padding:10px 28px; font-size:14px; border-bottom:1px solid #f0e2a0 }
  main { display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr; gap:14px; padding:18px 28px; max-width:1800px; margin:0 auto }
  @media (max-width:1400px) { main { grid-template-columns:repeat(4,1fr) } }
  @media (max-width:1100px) { main { grid-template-columns:repeat(3,1fr) } }
  @media (max-width:800px) { main { grid-template-columns:repeat(2,1fr) } }
  @media (max-width:520px) { main { grid-template-columns:1fr; padding:16px } }
  .card { border:1px solid var(--gris); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; background:#fff; position:relative; height:100% }
  .card.aprobada { box-shadow:0 0 0 2px var(--ok) inset }
  .card.cambiada { box-shadow:0 0 0 2px var(--no) inset }
  .pill { position:absolute; top:8px; left:8px; font-size:11px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.92); border:1px solid var(--gris); color:var(--sec); z-index:1 }
  .card.aprobada .pill { background:var(--ok); color:#fff; border-color:var(--ok) }
  .card.cambiada .pill { background:var(--no); color:#fff; border-color:var(--no) }
  .maniqui { background:#f3f3f3; aspect-ratio:1/1; flex:none; position:relative; overflow:hidden }
  .maniqui img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain }
  .maniqui .velo { position:absolute; inset:0; background:rgba(255,255,255,.75); display:none; align-items:center; justify-content:center; color:var(--sec); font-size:14px }
  .card.trabajando .velo { display:flex }
  .crops { display:flex; gap:4px; padding:6px 10px 0; overflow-x:auto; height:50px; flex:none; scrollbar-width:none }
  .crops img { height:40px; width:auto; border-radius:3px; border:1px solid var(--gris); display:block }
  .meta { padding:6px 10px 0; height:122px; flex:none; overflow:hidden }
  .chips { display:flex; gap:4px; flex-wrap:nowrap; margin-bottom:4px; height:20px; overflow:hidden }
  .chip { font-size:11px; padding:1px 7px; border-radius:99px; background:#f3f3f3; color:#333; white-space:nowrap }
  .fila { display:flex; gap:6px; align-items:baseline; margin-bottom:3px; font-size:12px }
  .id { font-weight:600; font-size:13px } .cat { color:var(--sec); text-transform:capitalize } .lote { color:var(--sec); margin-left:auto; font-size:11px } .marca { color:var(--sec) }
  dl { margin:0; display:grid; grid-template-columns:54px 1fr; row-gap:1px; column-gap:6px; font-size:12px; line-height:1.4 }
  dl div { display:contents } dt { color:var(--sec) }
  dd { margin:0; color:#222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  dd select { width:100%; padding:1px 4px; font-size:12px; height:20px }
  .comentario { position:absolute; left:8px; right:8px; bottom:8px; font-size:11px; color:#fff; background:rgba(179,38,30,.9); border-radius:6px; padding:4px 8px; line-height:14px; max-height:46px; overflow:hidden; display:none; z-index:1 }
  .card.cambiada .comentario { display:block }
  .acciones { display:flex; gap:6px; padding:6px 10px 10px; margin-top:auto; flex:none }
  .acciones button { flex:1; font-size:12px; padding:5px 6px }
  .card.aprobada .ok { background:var(--ok); color:#fff; border-color:var(--ok) }
  .card.cambiada .no { background:var(--no); color:#fff; border-color:var(--no) }
  .corregir { background:#222; color:#fff; border-color:#222 }
  .form { display:none; padding:0 12px 12px; gap:6px; flex-direction:column }
  .card.editando .form { display:flex } .card.editando .acciones { display:none }
  .form textarea { width:100%; min-height:64px; resize:vertical }
  .form .botones { display:flex; gap:6px } .form .botones button { flex:1; font-size:13px }
  #estado { padding:40px; color:var(--sec); grid-column:1/-1; text-align:center }
  .msg { position:absolute; left:8px; top:8px; right:8px; font-size:11px; color:#333; background:rgba(255,255,255,.92); border-radius:6px; padding:3px 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:none; z-index:1 }
  .msg:not(:empty) { display:block }
  .msg { top:36px }
  .filtros { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; align-items:center }
  .filtros select, .filtros input { font-size:13px; padding:6px 8px; max-width:150px }
  .filtros .limpiar { font-size:13px; color:var(--sec); background:none; border:none; text-decoration:underline; cursor:pointer }
</style></head>
<body>
<header>
  <h1>Mi closet</h1>
  <div class="conteo"><span>Prendas <b id="c-total">0</b></span><span>Aprobadas <b id="c-ok">0</b></span><span>Cambiadas <b id="c-no">0</b></span><span>Pendientes <b id="c-pend">0</b></span></div>
  <div class="filtros">
    <input id="f-q" type="search" placeholder="Buscar…">
    <select id="f-tipo"><option value="">Tipo de prenda</option></select>
    <select id="f-color"><option value="">Color</option></select>
    <select id="f-talla"><option value="">Talla</option></select>
    <select id="f-marca"><option value="">Marca</option></select>
    <select id="f-lote"><option value="">Lote</option></select>
    <select id="f-est"><option value="">Estado</option><option value="pendiente">Pendientes</option><option value="aprobada">Aprobadas</option><option value="cambiada">Cambiadas</option></select>
    <button class="limpiar" onclick="limpiar()">Limpiar</button>
    <span id="c-vis" style="color:var(--sec);font-size:13px"></span>
    <button onclick="exportar()">Exportar CSV</button>
  </div>
</header>
<div id="aviso">Estás viendo el archivo directo. Para aprobar, comentar y corregir, ábrelo con <code>./closet.sh</code> (http://localhost:8765).</div>
<main id="grid"><div id="estado">Cargando desde Supabase…</div></main>
<script>
const URL_SB = "https://nsbvxuvoybhnlcyzcjcp.supabase.co", KEY_SB = "sb_publishable_NfDzNL-vL3CLZO9t6kpC4Q_YG9GDdS1";
const MATERIALES = ["Algodón 100%", "Algodón 95% / Elastano 5%", "Algodón 98% / Elastano 2% (mezclilla)", "Algodón 80% / Poliéster 20%", "Algodón 60% / Poliéster 40%", "Poliéster 100%", "Poliéster 95% / Elastano 5%", "Poliéster 65% / Algodón 35%", "Poliéster 70% / Viscosa 30%", "Viscosa 100%", "Viscosa 95% / Elastano 5%", "Lino 100%", "Lino 55% / Algodón 45%", "Lana 100%", "Lana 80% / Poliamida 20%", "Seda 100%", "Cashmere 100%", "Lana 90% / Cashmere 10%", "Poliamida (nylon) 100%", "Poliamida 80% / Elastano 20%", "Acrílico 100%", "Poliuretano 100% (piel sintética)", "Cuero 100%"], TIPOS = [["top", "Top"], ["blusa", "Blusa"], ["camisa", "Camisa"], ["sweater", "Sweater"], ["cardigan", "Cardigan"], ["blazer", "Blazer"], ["chamarra", "Chamarra"], ["abrigo", "Abrigo"], ["vestido", "Vestido"], ["falda", "Falda"], ["pantalon", "Pantalón"], ["jeans", "Jeans"], ["shorts", "Shorts"], ["zapatos", "Zapatos"], ["bolsa", "Bolsa"], ["cinturon", "Cinturón"], ["accesorio", "Accesorio"]], COLORES = [["negro", "Negro"], ["blanco", "Blanco"], ["beige", "Beige"], ["gris", "Gris"], ["cafe", "Café"], ["azul", "Azul"], ["verde", "Verde"], ["rojo", "Rojo"], ["rosa", "Rosa"], ["morado", "Morado"], ["amarillo", "Amarillo"], ["naranja", "Naranja"], ["dorado", "Dorado"], ["plateado", "Plateado"], ["multicolor", "Multicolor"]], TALLAS = ["XS", "S", "M", "L", "XL", "XXL"];
const etTipo = Object.fromEntries(TIPOS), etColor = Object.fromEntries(COLORES);
const H = { "apikey": KEY_SB, "Authorization": "Bearer " + KEY_SB };
const EN_VIVO = location.protocol.startsWith("http");
if (!EN_VIVO) document.getElementById("aviso").style.display = "block";
let prendas = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const porId = id => prendas.find(p => p.id === id);
const card = id => document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);

async function cargar() {
  const [rp, ra] = await Promise.all([
    fetch(`${URL_SB}/rest/v1/prendas?select=*&order=lote,codigo`, { headers: H }),
    fetch(`${URL_SB}/rest/v1/apariciones?select=prenda_id,foto,n,es_detalle,crop_url&order=prenda_id,es_detalle,foto`, { headers: H }),
  ]);
  if (!rp.ok || !ra.ok) { document.getElementById("estado").textContent = "No se pudo leer Supabase (" + rp.status + "/" + ra.status + ")"; return; }
  prendas = await rp.json();
  const aps = await ra.json();
  for (const p of prendas) p.crops = aps.filter(a => a.prenda_id === p.id);
  const cnt = (f) => { const c = {}; for (const p of prendas) { const v = f(p); if (v) c[v] = (c[v] || 0) + 1; } return c; };
  const cTipo = cnt(p => p.tipo || p.categoria), cColor = cnt(p => p.color_base), cTalla = cnt(p => p.talla), cMarca = cnt(p => p.marca), cLote = cnt(p => p.lote);
  const op = (v, et, n) => `<option value="${esc(v)}">${esc(et)} (${n || 0})</option>`;
  document.getElementById("f-tipo").innerHTML += TIPOS.map(([v, et]) => op(v, et, cTipo[v])).join("");
  document.getElementById("f-color").innerHTML += COLORES.map(([v, et]) => op(v, et, cColor[v])).join("");
  const tallas = [...TALLAS.filter(t => cTalla[t]), ...Object.keys(cTalla).filter(t => !TALLAS.includes(t)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))];
  document.getElementById("f-talla").innerHTML += tallas.map(t => op(t, t, cTalla[t])).join("");
  document.getElementById("f-marca").innerHTML += Object.keys(cMarca).sort((a, b) => a.localeCompare(b)).map(m => op(m, m, cMarca[m])).join("");
  document.getElementById("f-lote").innerHTML += Object.keys(cLote).sort().map(l => op(l, l, cLote[l])).join("");
  pintar();
}
const val = id => document.getElementById(id).value;
function visibles() {
  const q = val("f-q").trim().toLowerCase(), ft = val("f-tipo"), fc = val("f-color"), fta = val("f-talla"), fm = val("f-marca"), fl = val("f-lote"), fe = val("f-est");
  return prendas.filter(p => (!ft || (p.tipo || p.categoria) === ft) && (!fc || p.color_base === fc) && (!fta || p.talla === fta)
    && (!fm || p.marca === fm) && (!fl || p.lote === fl) && (!fe || (p.estado || "pendiente") === fe)
    && (!q || [p.codigo, p.categoria, p.tipo, p.color, p.color_base, p.estilo, p.detalles, p.marca, p.talla, p.marca_talla, p.material, p.descripcion].join(" ").toLowerCase().includes(q)));
}
function limpiar() { for (const id of ["f-q", "f-tipo", "f-color", "f-talla", "f-marca", "f-lote", "f-est"]) document.getElementById(id).value = ""; pintar(); }
function imgUrl(p) { return p.maniqui_url ? `${p.maniqui_url}?v=${p.version || 1}` : ""; }
function tarjeta(p) {
  const est = p.estado || "pendiente";
  return `
<article class="card ${est === "pendiente" ? "" : est}" data-id="${esc(p.id)}">
  <div class="maniqui">${p.maniqui_url ? `<img src="${esc(imgUrl(p))}" loading="lazy">` : ""}<div class="velo">Corrigiendo con Gemini…</div>
    <span class="pill">${est === "aprobada" ? "Aprobada" : est === "cambiada" ? "Se cambió" : "Pendiente"}</span>
    <div class="msg"></div><div class="comentario" title="${esc(p.comentario || "")}">${esc(p.comentario || "")}</div></div>
  <div class="crops">${p.crops.map(c => `<a href="${esc(c.crop_url)}" target="_blank" title="${esc(c.foto)}${c.es_detalle ? " (detalle)" : ""}"><img src="${esc(c.crop_url)}" loading="lazy"></a>`).join("")}</div>
  <div class="meta">
    <div class="fila"><span class="id">${esc(p.codigo)}</span><span class="cat">${esc(etTipo[p.tipo] || p.categoria)}</span><span class="lote">${esc(p.lote)}</span></div>
    <div class="chips">${[p.color_base && etColor[p.color_base], p.talla && "Talla " + p.talla, p.marca].filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    <dl>
      <div><dt>Color</dt><dd title="${esc(p.color || "")}">${esc(p.color || "—")}</dd></div>
      <div><dt>Estilo</dt><dd title="${esc(p.estilo || "")}">${esc(p.estilo || "—")}</dd></div>
      <div><dt>Material</dt><dd><select onchange="material('${esc(p.id)}', this.value)"><option value="">—</option>${MATERIALES.map(m => `<option value="${esc(m)}"${m === p.material ? " selected" : ""}>${esc(m)}</option>`).join("")}</select></dd></div>
      <div><dt>Detalles</dt><dd title="${esc(p.detalles || "")}">${esc(p.detalles || "—")}</dd></div>
    </dl>
  </div>
  <div class="acciones">
    <button class="ok" onclick="aprobar('${esc(p.id)}')">Aprobar</button>
    <button class="no" onclick="abrirForm('${esc(p.id)}')">Se cambió</button>
    ${est === "cambiada" && p.comentario ? `<button class="corregir" onclick="corregir('${esc(p.id)}')">Corregir</button>` : ""}
  </div>
  <div class="form">
    <textarea placeholder="¿Qué tiene distinto el maniquí? Ej. la pretina es solo de resorte, sin cordón; el color es más oscuro…">${esc(p.comentario || "")}</textarea>
    <div class="botones"><button onclick="cerrarForm('${esc(p.id)}')">Cancelar</button><button onclick="enviarCambio('${esc(p.id)}', false)">Guardar comentario</button><button class="corregir" onclick="enviarCambio('${esc(p.id)}', true)">Enviar y corregir</button></div>
  </div>
</article>`;
}
function pintar() {
  const lista = visibles();
  document.getElementById("grid").innerHTML = lista.length ? lista.map(tarjeta).join("") : '<div id="estado">Nada con esos filtros</div>';
  let ok = 0, no = 0;
  for (const p of prendas) { if (p.estado === "aprobada") ok++; else if (p.estado === "cambiada") no++; }
  document.getElementById("c-total").textContent = prendas.length;
  document.getElementById("c-ok").textContent = ok;
  document.getElementById("c-no").textContent = no;
  document.getElementById("c-pend").textContent = prendas.length - ok - no;
  document.getElementById("c-vis").textContent = lista.length === prendas.length ? "" : `${lista.length} de ${prendas.length}`;
}
function repintar(p) { const c = card(p.id); if (c) c.outerHTML = tarjeta(p); pintar(); }
function msg(id, texto, error) { const c = card(id); if (!c) return; const m = c.querySelector(".msg"); m.textContent = texto; m.style.color = error ? "var(--no)" : "var(--sec)"; }
async function api(ruta, body) {
  if (!EN_VIVO) throw new Error("Abre la página con ./closet.sh para editar en vivo.");
  const r = await fetch(ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function aprobar(id) {
  const p = porId(id);
  try { Object.assign(p, await api("/api/revision", { id, estado: p.estado === "aprobada" ? "pendiente" : "aprobada" })); repintar(p); }
  catch (e) { msg(id, e.message, true); }
}
function abrirForm(id) { card(id).classList.add("editando"); card(id).querySelector("textarea").focus(); }
function cerrarForm(id) { card(id).classList.remove("editando"); }
async function enviarCambio(id, yCorregir) {
  const p = porId(id), texto = card(id).querySelector("textarea").value.trim();
  if (!texto) { msg(id, "Escribe qué tiene distinto.", true); return; }
  try {
    Object.assign(p, await api("/api/revision", { id, estado: "cambiada", comentario: texto }));
    repintar(p);
    if (yCorregir) await corregir(id);
  } catch (e) { msg(id, e.message, true); }
}
async function corregir(id) {
  const p = porId(id), c = card(id);
  c.classList.add("trabajando"); c.querySelectorAll("button").forEach(b => b.disabled = true);
  try { Object.assign(p, await api("/api/corregir", { id })); repintar(p); msg(id, "Maniquí regenerado. Revísalo y aprueba o vuelve a comentar."); }
  catch (e) { c.classList.remove("trabajando"); c.querySelectorAll("button").forEach(b => b.disabled = false); msg(id, e.message, true); }
}
async function material(id, valor) {
  const p = porId(id);
  try { Object.assign(p, await api("/api/revision", { id, material: valor })); msg(id, "Material guardado."); }
  catch (e) { msg(id, e.message, true); }
}
function csv(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportar() {
  const filas = [["id", "lote", "codigo", "tipo", "color_base", "talla", "marca", "marca_talla", "color", "estilo", "material", "detalles", "estado", "comentario", "maniqui"]];
  for (const p of prendas) filas.push([p.id, p.lote, p.codigo, p.tipo || p.categoria, p.color_base, p.talla, p.marca, p.marca_talla, p.color, p.estilo, p.material, p.detalles, p.estado || "pendiente", p.comentario, p.maniqui_url]);
  const blob = new Blob(["﻿" + filas.map(f => f.map(csv).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mi_closet_revision.csv"; a.click();
}
for (const id of ["f-tipo", "f-color", "f-talla", "f-marca", "f-lote", "f-est"]) document.getElementById(id).addEventListener("change", pintar);
document.getElementById("f-q").addEventListener("input", pintar);
cargar();
</script>
</body></html>
